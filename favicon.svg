<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0a0c"/>
  <!-- VR headset body -->
  <rect x="64" y="176" width="384" height="200" rx="40" ry="40" fill="#8B0000"/>
  <!-- Left lens -->
  <rect x="90" y="204" width="140" height="144" rx="24" ry="24" fill="#0a0a0c"/>
  <rect x="100" y="214" width="120" height="124" rx="18" ry="18" fill="#1a0505"/>
  <!-- Right lens -->
  <rect x="282" y="204" width="140" height="144" rx="24" ry="24" fill="#0a0a0c"/>
  <rect x="292" y="214" width="120" height="124" rx="18" ry="18" fill="#1a0505"/>
  <!-- Center bridge -->
  <rect x="230" y="240" width="52" height="72" rx="8" ry="8" fill="#6B0000"/>
  <!-- Strap left -->
  <rect x="24" y="226" width="40" height="100" rx="12" ry="12" fill="#6B0000"/>
  <!-- Strap right -->
  <rect x="448" y="226" width="40" height="100" rx="12" ry="12" fill="#6B0000"/>
  <!-- Gold accent line -->
  <rect x="64" y="340" width="384" height="6" rx="3" ry="3" fill="#D4AF37" opacity="0.4"/>
  <!-- Lens glint left -->
  <ellipse cx="130" cy="234" rx="14" ry="8" fill="white" opacity="0.08"/>
  <!-- Lens glint right -->
  <ellipse cx="322" cy="234" rx="14" ry="8" fill="white" opacity="0.08"/>
</svg>
